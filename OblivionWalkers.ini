; Oblivion Walkers - read once when the game starts (docs/walkers-spec.md).

[Rise]
; The fallen get up again. 1 on, 0 off.
Enabled=1
; Seconds after the death before a fallen person gets up, counted only while
; his cell is loaded - so the getting-up is always in view, never off-screen.
AfterSeconds=20
; Up to this many seconds more, at random, so a heap of fallen does not get
; up in one go.
JitterSeconds=10
; How many of the fallen get up at all, in percent.
ChancePercent=100
; 1: only generic people - the bandits, marauders and the like of the
; leveled lists (the base record's no-low-level-processing flag). 0: every
; non-essential person, quest people included, at your own risk.
OnlyGeneric=1
; 1: only people of a playable race - men, mer and the beast folk. A Dremora
; or a Golden Saint is a person to the engine too, but no zombie. 0: every
; race.
OnlyPlayableRaces=1
; 1: narrower still, only the four human races - Imperial, Breton, Nord,
; Redguard. 0: every playable race.
OnlyHumans=0
; 1: the fallen rises as a walker - the ESP's zombie creature placed on his
; corpse, the corpse hidden, the zombie dropped and raised at the spot with
; the get-up animation, his items on it (OblivionWalkers.esp must be active;
; without it he gets up as himself). 0: the person himself gets up.
AsCreature=1
; Seconds the walker, unseen, settles where the man lies before the two
; change places.
DropSeconds=1.5
; Seconds the walker lies in the man's place before it gets up.
LieSeconds=1
; How the walker takes the man's place before the two change places:
; 1 it is moved onto his spot and turned his way, its limbs as they fell;
; 2 it is laid into his pose bone by bone - its limbs like his; 0 it lies
; where it fell.
MatchCorpse=2
; With 2: seconds the walker, unseen, settles into his pose before it is
; moved onto his spot once more and shown - he lies seen all the while, and
; the two change places in one frame. 0: shown a frame after it is laid into
; his pose, which can still slide a little while it lies.
SettleSeconds=1.5
; 1: while the walker, unseen, falls and settles where the man lies, his
; body cannot push it - its ragdoll is put into the walker's collision
; group (it still lies on the ground and meets everything else). 0: the
; two bodies push each other until they change places - with 2 the walker
; can end up beside or on him.
KeepCorpseApart=1
; The walker dies unseen without a sound. How often in 100 the sound it
; would have made plays as it gets up; 0: it always gets up silent.
SoundAtGetUpPercent=60
; The fallback path (AsCreature=0), for the proof runs: the risen one gets a
; clone of his base record before he gets up. 0 off.
CloneBase=0
; With the clone: the clone's race becomes the Walker race of
; OblivionWalkers.esp (which must be active). 0: he keeps his race.
ZombieRace=1
; Seconds after the raise before the risen one is rebuilt from his new
; record, so the race shows - after the get-up animation. 0: at once.
LookAfterSeconds=3

[Zombies]
; 1: the walkers never run - a run their AI asks for becomes a walk. 0: they
; run as the game's zombies do.
Walk=1
; The walkers' health, 1 to 100 percent of the game's zombie's. 25 with
; more of them ([Replace] MaxCount) makes the softies.
HealthPercent=15
; The walkers' pace: SpeedMultiplier times the game's zombie's (Speed 12,
; about 40 units a second), spread over the four kinds of walker from
; SpeedRandomPercent under that to as much over: some shuffle, some hurry.
; SpeedRandomPercent=0: all at one pace.
SpeedMultiplier=1.0
SpeedRandomPercent=30
; A point of fame for every FamePerKills walkers you cut down (28 Days
; gave one per 50). 0: none, the default.
FamePerKills=0
; 1: nobody rises in a chapel - the city chapels, their halls and
; undercrofts, Kvatch's and Weynon Priory's (28 Days' safe zones). 0: there too.
AvoidChapels=1
; 1: the walkers are called Name. 0: the game's "Zombie".
RenameToWalker=1
Name=Walker
; 1: the game's and the mods' zombies are called so too - every "Zombie" in a
; creature's name becomes Name (Headless Zombie: Headless Walker). 0: they
; keep their names.
RenameVanilla=0
; 1: a dead walker from a spawn cannot be activated - nothing opens, no
; loot. The fallen who rose as walkers keep theirs: their bodies always open.
; 0: every walker lootable.
NoLoot=1
; 1: with Maskar's Oblivion Overhaul, a dead walker loses the token and
; the brain MOO gives zombies, so MOO does not raise it again. 0: MOO's own
; zombie settings decide (its ini_zombie_resurrect).
BlockMooResurrect=1

[Replace]
; 1: the creatures and people of the leveled lists - the game's and every
; mod's - are replaced by walkers at their spawn points, each as its line in
; [ReplaceCreatures] below says. Already spawned ones stay until their cell
; resets.
Enabled=1
; Walkers per replaced spawn, 1 to 10: any count from MinCount to MaxCount,
; each about as likely.
MinCount=1
MaxCount=10
; More walkers than the replaced spawns give: walker entries beside a
; list's own creatures and people, so this percent of its picks become
; walkers (up to 90). 0: none.
ExtraPercent=0
; [ReplaceCreatures]: every creature and person the leveled lists of
; Oblivion, Shivering Isles, Knights of the Nine and the official DLCs can
; spawn, "Name [File ID]=1" for walkers there, =0 to keep it. All people,
; harmless animals, creatures that only swim and creatures with a script (a
; quest may count on them) start at 0, with the reason after the bracket.
; A mod's creatures and people get their lines at the first start with the
; mod, by the same rules, at the end. Lines you change are kept; a deleted
; line comes back with its default.

