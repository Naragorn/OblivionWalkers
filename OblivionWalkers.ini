; Oblivion Walkers - read once when the game starts (docs/walkers-spec.md).

[Rise]
; The fallen get up again. 1 on, 0 off.
Enabled=1
; Seconds after the death before a fallen person gets up, counted only while
; his cell is loaded - so the getting-up is always in view, never off-screen.
AfterSeconds=20
; Up to this many seconds more, at random, so a heap of fallen does not get
; up in one go.
JitterSeconds=10
; How many of the fallen get up at all, in percent.
ChancePercent=100
; 1: only generic people - the bandits, marauders and the like of the
; leveled lists (the base record's no-low-level-processing flag). 0: every
; non-essential person, quest people included, at your own risk.
OnlyGeneric=1
; 1: only people of a playable race - men, mer and the beast folk. A Dremora
; or a Golden Saint is a person to the engine too, but no zombie. 0: every
; race.
OnlyPlayableRaces=1
; 1: narrower still, only the four human races - Imperial, Breton, Nord,
; Redguard. 0: every playable race.
OnlyHumans=0
; 1: the fallen rises as a walker - the ESP's zombie creature placed on his
; corpse, the corpse hidden, the zombie dropped and raised at the spot with
; the get-up animation, his items on it (OblivionWalkers.esp must be active;
; without it he gets up as himself). 0: the person himself gets up.
AsCreature=1
; Seconds between dropping the placed zombie and raising it, for its ragdoll
; to settle where the man lay.
DropSeconds=1.5
; The fallback path (AsCreature=0), for the proof runs: the risen one gets a
; clone of his base record before he gets up. 0 off.
CloneBase=0
; With the clone: the clone's race becomes the Walker race of
; OblivionWalkers.esp (which must be active). 0: he keeps his race.
ZombieRace=1
; Seconds after the raise before the risen one is rebuilt from his new
; record, so the race shows - after the get-up animation. 0: at once.
LookAfterSeconds=3
