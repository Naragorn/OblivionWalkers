; Oblivion Walkers - read once when the game starts (docs/walkers-spec.md).

[Rise]
; The fallen get up again. 1 on, 0 off.
Enabled=1
; Seconds after the death before a fallen person gets up, counted only while
; his cell is loaded - so the getting-up is always in view, never off-screen.
AfterSeconds=20
; Up to this many seconds more, at random, so a heap of fallen does not get
; up in one go.
JitterSeconds=10
; How many of the fallen get up at all, in percent.
ChancePercent=100
; 1: only generic people - the bandits, marauders and the like of the
; leveled lists (the base record's no-low-level-processing flag). 0: every
; non-essential person, quest people included, at your own risk.
OnlyGeneric=1
; 1: only people of a playable race - men, mer and the beast folk. A Dremora
; or a Golden Saint is a person to the engine too, but no zombie. 0: every
; race.
OnlyPlayableRaces=1
; 1: narrower still, only the four human races - Imperial, Breton, Nord,
; Redguard. 0: every playable race.
OnlyHumans=0
; 1: the fallen rises as a walker - the ESP's zombie creature placed on his
; corpse, the corpse hidden, the zombie dropped and raised at the spot with
; the get-up animation, his items on it (OblivionWalkers.esp must be active;
; without it he gets up as himself). 0: the person himself gets up.
AsCreature=1
; Seconds the walker, unseen, settles where the man lies before the two
; change places.
DropSeconds=1.5
; Seconds the walker lies in the man's place before it gets up.
LieSeconds=1
; How the walker takes the man's place before the two change places:
; 1 it is moved onto his spot and turned his way, its limbs as they fell;
; 2 it is laid into his pose bone by bone - its limbs like his; 0 it lies
; where it fell.
MatchCorpse=2
; With 2: seconds the walker, unseen, settles into his pose before it is
; moved onto his spot once more and shown - he lies seen all the while, and
; the two change places in one frame. 0: shown a frame after it is laid into
; his pose, which can still slide a little while it lies.
SettleSeconds=1.5
; 1: while the walker, unseen, falls and settles where the man lies, his
; body cannot push it - its ragdoll is put into the walker's collision
; group (it still lies on the ground and meets everything else). 0: the
; two bodies push each other until they change places - with 2 the walker
; can end up beside or on him.
KeepCorpseApart=1
; The walker dies unseen without a sound. How often in 100 the sound it
; would have made plays as it gets up; 0: it always gets up silent.
SoundAtGetUpPercent=60
; A test switch: 1 the unseen death is silent (the default); 0 the engine
; plays its death sound as before.
HoldDeathSound=1
; The fallback path (AsCreature=0), for the proof runs: the risen one gets a
; clone of his base record before he gets up. 0 off.
CloneBase=0
; With the clone: the clone's race becomes the Walker race of
; OblivionWalkers.esp (which must be active). 0: he keeps his race.
ZombieRace=1
; Seconds after the raise before the risen one is rebuilt from his new
; record, so the race shows - after the get-up animation. 0: at once.
LookAfterSeconds=3

[Zombies]
; 1: the walkers never run - a run their AI asks for becomes a walk. 0: they
; run as the game's zombies do.
Walk=1
; The walkers' health, 1 to 100 percent of the game's zombie's. 25 with
; more of them ([Replace] MaxCount) makes the softies.
HealthPercent=15
; The walkers' pace: SpeedMultiplier times the game's zombie's (Speed 12,
; about 40 units a second), spread over the four kinds of walker from
; SpeedRandomPercent under that to as much over: some shuffle, some hurry.
; SpeedRandomPercent=0: all at one pace.
SpeedMultiplier=1.0
SpeedRandomPercent=30
; A point of fame for every FamePerKills walkers you cut down (28 Days
; gave one per 50). 0: none, the default.
FamePerKills=0
; 1: nobody rises in a chapel - the city chapels, their halls and
; undercrofts, Kvatch's and Weynon Priory's (28 Days' safe zones). 0: there too.
AvoidChapels=1
; 1: the walkers are called Name. 0: the game's "Zombie".
RenameToWalker=1
Name=Walker
; 1: the game's and the mods' zombies are called so too - every "Zombie" in a
; creature's name becomes Name (Headless Zombie: Headless Walker). 0: they
; keep their names.
RenameVanilla=0
; 1: a dead walker from a spawn cannot be activated - nothing opens, no
; loot. The fallen who rose as walkers keep theirs: their bodies always open.
; 0: every walker lootable.
NoLoot=1
; 1: with Maskar's Oblivion Overhaul, a dead walker loses the token and
; the brain MOO gives zombies, so MOO does not raise it again. 0: MOO's own
; zombie settings decide (its ini_zombie_resurrect).
BlockMooResurrect=1
; 1: with Maskar's Ultimate Leveling or Oblivion XP Update, a walker's death
; gives no experience (as it dies, the values the two multiply a kill's
; experience by go to 0: Confidence and Aggression, the eight attributes).
; Oblivion XP still shows its line, with 0.00 XP. 0: walkers count as any kill.
NoLevelingXP=1
; 1: blows on and from walkers train no skill - Blade, Blunt, Hand to Hand,
; Marksman, Block and the armor (the skill use of a hit between the player
; and a walker is held back). Destruction trains at the cast and still does.
; 0: walkers train as anyone.
NoSkillGain=1
; 1: only a lost head ends a walker (docs/walkers-spec.md 4.17). A walker
; that falls gets up again after RiseAgainSeconds plus up to
; RiseAgainJitterSeconds, every time, until its head is off: in VR cut it
; off with OBVR (its [Hands] Dismemberment=1), on the killing blow or on the
; corpse before it gets up. Without OBVR cutting heads a power attack's kill
; ends a walker instead. No walker without a head is spawned or rises while
; this is on. 0: a walker dies once, as any creature.
DieOnlyBeheaded=1
RiseAgainSeconds=20
RiseAgainJitterSeconds=10

[Replace]
; 1: the creatures and people of the leveled lists - the game's and every
; mod's - are replaced by walkers at their spawn points, as [ReplaceCategories]
; says (and [ReplaceCreatures] for those no category takes). Already spawned
; ones stay until their cell resets. Switched in LINK's menu, it takes at
; once: from then on the spawn points spawn as it says.
Enabled=1
; Walkers per replaced spawn, 1 to 10: any count from MinCount to MaxCount,
; each about as likely.
MinCount=1
MaxCount=10
; More walkers than the replaced spawns give: walker entries beside a
; list's own creatures and people, so this percent of its picks become
; walkers (up to 90). 0: none.
ExtraPercent=0

[ReplaceCategories]
; Which creatures and people become walkers, by kind - whatever a record is
; called, the game's and every mod's. A creature's kind is the folder of its
; model (every skeleton's is Creatures\Skeleton\ or a mod's own Skeleton\
; folder, Bregor the Cremator's too); a person's is an Oblivion faction (every
; vampire is in the vampire faction, whatever its class). 1: walkers, 0: kept.
; Creatures with a script (a quest or the arena may count on them) and those
; that only swim stay, whatever their kind says - [ReplaceExceptions] below
; can still turn one. Each is in LINK's menu too, and takes at once there.
; Creatures:
Skeletons=1
Zombies=1
Ghosts=1
Liches=1
Shambles=1
SkinnedHounds=1
Atronachs=1
Clannfears=1
Daedroths=1
Scamps=1
SpiderDaedra=1
Xivilai=1
Hungers=1
Goblins=1
Trolls=1
Ogres=1
Minotaurs=1
LandDreughs=1
Imps=1
Spriggans=1
Wisps=1
Wolves=1
Bears=1
MountainLions=1
Boars=1
Rats=1
MudCrabs=1
TameAnimals=0
Slaughterfish=0
Elytra=1
Gnarls=1
Grummites=1
Baliwogs=1
Scalons=1
; People (all 0, as before: Nadi, 2026-10-24):
Vampires=0
Necromancers=0
Conjurers=0
Bandits=0
Marauders=0
Dremora=0
MythicDawn=0
Adventurers=0
Zealots=0
Heretics=0
KnightsOfOrder=0

; [ReplaceExceptions]: single creatures or people against their kind, before
; every other rule - a line as in [ReplaceCreatures] below, the name only to
; read (the file and the ID in the brackets decide), 1 walkers, 0 kept. The
; line "Bregor the Cremator [Oblivion.esm 080D25]" set to 0 keeps him though
; Skeletons=1.
[ReplaceExceptions]

[Horde]
; 1: walkers out of a fight do not stand around - one leads, walking to a
; point a little ahead of it that keeps moving on, and those near it follow,
; so the group drifts through the land. Outdoors only. 0: their own AI.
Enabled=1
; How near a lone walker must be to a leader to join it, in units.
JoinRadius=1500
; How far ahead of the leader the point it walks to is.
LeadUnits=2000
; Seconds a leader may come no nearer before it turns another way.
StaleSeconds=30
; The most a group turns each time it reaches its point, in degrees.
TurnDegrees=60
; Followers per leader at most.
GroupMost=8
; 1: a group in Tamriel heads for the nearest city gate within CityRange,
; each step leaning CityPull (0 none, 1 straight) of the way toward it, and
; stops GateHoldUnits in front of the door - never inside. 0: at random.
TowardCities=1
CityPull=0.5
CityRange=40000
GateHoldUnits=800

[Guards]
; 1: guards come out of a city's gate where walkers stand near it - one for
; every ZombiesPerGuard walkers, at most 21 per city. A guard who falls is
; replaced by the next, who comes out at the gate behind the fight; when none
; is left, the fallen get up there again. ClearSeconds after the last walker
; near the gate is gone, they go back in. They are copies of the city's own
; guards (not essential), with HealthFactor times a walker's health.
Enabled=1
HealthFactor=5
ZombiesPerGuard=5
; Walkers this near a gate's door count, in units.
Radius=4000
ClearSeconds=30
; A test switch, 0 (off): a guard out this many seconds is killed where it
; stands - to watch the fallen replaced and raised.
TestKillSeconds=0

[Safeguard]
; 1: whoever the walkers kill - people and creatures alike, but not those
; who rise as walkers - gets up again where they fell, AfterSeconds later at
; the soonest, once no living walker is within Radius units and while you
; are near (the body loaded). So no quest is lost to the walkers.
; 0 is more realistic - the dead stay dead - but then a quest's people the
; walkers kill stay dead too, and their quests may break.
Enabled=1
AfterSeconds=15
Radius=3000

[News]
; 1: the Black Horse Courier's broadsheets in the inns, taverns and the
; Courier's office in the Imperial City carry the walkers' news - the
; outbreak, a horde heading for a city, walkers at a city's gates (its guards
; came out), or several cities at once. Only the broadsheets Oblivion places
; itself, while you are in their cell; 0 leaves them as they are.
Courier=1
; An attack on a city's gates is news for this many game days.
RecentDays=3
; A horde seen heading for a city stays the news this many game days after
; it was last seen (0.5: half a day), so the sheets do not flip back to the
; outbreak whenever the horde is out of reach for a moment.
HeadingHoldDays=0.5

[Grab]
; Grabbed by walkers (docs/walkers-spec.md 4.19), as in Saints & Sinners: a
; walker's hit on you may grab an arm and hold you where you stand - walking
; off frees no one; each holder bites every BiteSeconds, and the last of
; BitesToDie bites kills (god mode leaves you a point). Strike a holder
; StruggleHits times, kill it, or mash Block to break free; in VR OBVR can
; shake it off. 0 switches it off.
Enabled=1
; Of a walker's landed hits on you, how many grab (percent).
ChancePercent=50
; The bites you take: the last one kills.
BitesToDie=3
; Seconds from the grab to the first bite, and between bites.
BiteSeconds=4
; What a bite before the last takes, in percent of your base health.
BiteHealthPercent=20
; Your blows on a holder that make it let go.
StruggleHits=2
; Units between you and a holder that make it let go: a door, a teleport.
TearFreeDistance=1000
; Free this many seconds, the bites are forgotten.
BiteResetSeconds=30
; Mash Block to wrench the longest holder off, none more than
; StruggleGapSeconds apart; each press costs StruggleFatigue. How many: the
; more walkers around you and the less stamina left, the more -
;   StrugglePresses x crowd x tiredness, the crowd 1 + StruggleCrowdStep per
;   walker within StruggleCrowdRadius beyond the first (at most
;   StruggleCrowdMost), the tiredness 1 fresh to 2 with no fatigue left.
; One walker, fresh: 4; three: 8; five or more: 12; three and a quarter of
; your fatigue left: 14. The time is the bites': the last one kills. 0: off.
StrugglePresses=4
StruggleCrowdStep=0.5
StruggleCrowdMost=3
StruggleCrowdRadius=300
StruggleGapSeconds=0.8
StruggleFatigue=5
; The control mashed, as the game's controls menu has it bound: 6 Block (the
; default), 5 Activate, 13 Jump (xOBSE's control numbers).
StruggleControl=6
; 1: a line on the screen when a walker grabs you, bites, and when you break free.
Messages=1
; VR (with OBVR): swing the held hand to shake its walker off, as in Saints &
; Sinners - each swing OBVR counts is a stroke; ShakeStrokes of them, harder
; the same way as the presses (crowd and tiredness), none more than
; StruggleGapSeconds apart, shake that arm's holder off. Each stroke costs
; ShakeFatigue. One walker, fresh: 6. 0: off (strike or mash Block then).
ShakeStrokes=6
ShakeFatigue=2

; [ReplaceCreatures]: the creatures and people of the leveled lists that no
; category of [ReplaceCategories] takes - of Oblivion, Shivering Isles,
; Knights of the Nine and the official DLCs below, "Name [File ID]=1" for
; walkers there, =0 to keep it. All people, harmless animals, creatures that
; only swim and creatures with a script (a quest may count on them) start at
; 0, with the reason after the bracket. A mod's get their lines at the first
; start with the mod, by the same rules, at the end. Lines you change are
; kept; a deleted line comes back with its default. A line for one a
; category takes counts for nothing - set it in [ReplaceExceptions].

